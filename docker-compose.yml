# ============================================================
# 地球探索者 · 全栈容器编排（前端 Nginx + 后端 FastAPI）
#
# 用法：
#   首次/构建：  docker compose up -d --build
#   后台启动：   docker compose up -d
#   查看日志：   docker compose logs -f api  /  web
#   停止：       docker compose down
#
# 访问：
#   - 前端： http://localhost:8080   （nginx 托管 SPA，/api、/ws 反代到 api:8787）
#   - 后端： http://localhost:8787/api/health
#
# 密钥注入（按优先级）：
#   1. 宿主环境变量（最高，适合 CI/云平台注入 VOLC_* 密钥）
#   2. ./api/.env 文件（本地开发，真实密钥不提交仓库）
#   镜像内不打包任何密钥，构建产物可安全分发。
# ============================================================

services:
  # ---- 前端：React SPA（nginx 静态托管 + 反向代理）----
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      # 构建期注入 VITE_* 开关（可选，未注入时使用仓库默认值：OSM 底图 + 浏览器语音回退）
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_ASR_PROVIDER: ${VITE_ASR_PROVIDER:-browser}
        VITE_TTS_PROVIDER: ${VITE_TTS_PROVIDER:-browser}
        VITE_LLM_PROVIDER: ${VITE_LLM_PROVIDER:-keyword}
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
    image: earth-explorer-web:latest
    container_name: earth-explorer-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # ---- 后端：FastAPI ----
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: earth-explorer-api:latest
    container_name: earth-explorer-api
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - ./api/.env
    environment:
      - PORT=8787
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
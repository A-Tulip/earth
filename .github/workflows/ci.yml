# ============================================================
# 地球探索者 · CI / CD 工作流
#
# 触发：
#   - push / pull_request 到 main：完整 CI（前端质量 + 后端校验）
#
# 部署：交由 Vercel 原生 GitHub 集成托管（Preview + Production），CI 不负责部署。
# 若日后改用 CI 部署，需在仓库 Secrets 配置 VERCEL_TOKEN、VERCEL_ORG_ID、VERCEL_PROJECT_ID。
# ============================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 前端质量门禁 ----------
  frontend:
    name: Frontend (typecheck · test · validate · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Validate lesson content
        run: npm run validate:content

      - name: Production build
        run: npm run build

  # ---------- 后端校验 ----------
  backend:
    name: Backend (python compile · docker build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate main.py compiles
        working-directory: api
        run: python -m py_compile main.py

      - name: Build backend Docker image
        working-directory: api
        run: docker build -t earth-explorer-api:ci .

  # ---------- 前端部署 ----------
  # 部署交由 Vercel 原生 GitHub 集成托管（Preview + Production 自动部署，无需额外 token）。
  # 历史坑：此前的 amondnet/vercel-action job 因仓库缺少 VERCEL_TOKEN secret 而持续失败，
  # 且与 Vercel 原生集成重复，现移除该冗余 job，使 CI 全绿。若后续改用 CI 部署，
  # 需先在仓库 Secrets 配置 VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID 三个值。
# ============================================================
# 地球探索者 · 前端 nginx 配置
#
# 职责：
#   1. 托管 Vite 构建产物（SPA，未知路径回退到 index.html）
#   2. 反向代理 /api 与 /ws 到后端 FastAPI（compose 服务名 api:8787）
#   3. Cesium 静态资源（/cesium）与其它静态文件开启缓存
#
# 说明：
#   - 容器内由 docker-compose 注入的 DNS 解析指向 api 服务；
#   - /ws 需开启 WebSocket Upgrade 头，保证实时语音（流式 ASR / S2S）可用。
# ============================================================

# 隐藏 nginx 版本号，降低信息泄露
server_tokens off;

# 后端上游：compose 网络内直接用服务名 api，端口 8787
upstream backend_api {
    server api:8787;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- SPA 回退：所有非后台路径都交给 React 前端路由 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 静态资源缓存（Cesium Workers/Assets + 构建产物指纹资源）----
    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 REST API 反向代理 ----
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # 关键：图表/LLM 接口可能返回大体积 base64，需关闭缓冲避免乒乓
        proxy_buffering off;
    }

    # ---- 后端 WebSocket 反向代理（实时语音：/ws/asr、/ws/s2s）----
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 常见但不存在的文件直接 404，避免落到 SPA ----
    location ~* ^\.(env|git)$ {
        return 404;
    }
}